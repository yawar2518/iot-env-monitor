# =============================================================
# Mosquitto MQTT Broker Configuration — Local Development
# =============================================================

# -------------------------------------------------------------
# LISTENERS
# -------------------------------------------------------------

# Standard MQTT over TCP — used by ESP32 and Django backend.
listener 1883
protocol mqtt

# MQTT over WebSocket — useful for browser-based debugging tools
# like MQTT Explorer connecting via browser.
listener 9001
protocol websockets

# -------------------------------------------------------------
# AUTHENTICATION
# -------------------------------------------------------------

# Reject all anonymous connections.
# Every client must supply a username and password.
allow_anonymous false

# Path to the hashed password file.
# Generated via mosquitto_passwd utility — see README.
password_file /mosquitto/config/passwd

# -------------------------------------------------------------
# ACCESS CONTROL
# -------------------------------------------------------------

# Path to the ACL (Access Control List) file.
# Controls which client can publish/subscribe to which topics.
acl_file /mosquitto/config/acl.conf

# -------------------------------------------------------------
# PERSISTENCE
# -------------------------------------------------------------

# Save retained messages and subscriptions to disk.
# Survives broker restarts.
persistence true
persistence_location /mosquitto/data/

# -------------------------------------------------------------
# LOGGING
# -------------------------------------------------------------

# Log to stdout so Docker captures it with `docker compose logs`.
log_dest stdout
log_type all

# Also log to file for persistent debugging.
log_dest file /mosquitto/log/mosquitto.log
log_timestamp true