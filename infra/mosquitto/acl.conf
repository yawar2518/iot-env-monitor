# =============================================================
# Mosquitto ACL — Topic Access Control
# =============================================================
# Pattern rules use %u for username substitution.
#
# Topic structure:
#   sensors/{device_id}/telemetry   ← device publishes readings
#   devices/{device_id}/commands    ← backend publishes commands
#   devices/{device_id}/status      ← device publishes heartbeat
# =============================================================

# -------------------------------------------------------------
# ESP32 DEVICE (username: esp32_device)
# Can publish sensor readings and status.
# Can subscribe to receive commands directed at it.
# Cannot access any other topics.
# -------------------------------------------------------------
user esp32_device

# Publish: telemetry readings
topic write sensors/+/telemetry

# Publish: heartbeat / online status
topic write devices/+/status

# Subscribe: receive remote commands
topic read devices/+/commands


# -------------------------------------------------------------
# DJANGO BACKEND SERVICE (username: backend_service)
# Can subscribe to all device telemetry and status.
# Can publish commands to any device.
# Has broad access because it orchestrates all devices.
# -------------------------------------------------------------
user backend_service

# Subscribe: receive all device telemetry
topic read sensors/#

# Subscribe: receive all device status/heartbeat
topic read devices/#

# Publish: send commands to any device
topic write devices/+/commands